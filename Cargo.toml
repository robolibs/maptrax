[package]
name = "maptrax"
version = "0.1.1"
edition = "2024"
description = "Rust agricultural field planning library translated from farmtrax"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
datapod = { git = "https://codeberg.org/robolibs/datapod.git", tag = "0.4.0" }
concord = { git = "https://codeberg.org/robolibs/concord.git", tag = "0.1.1" }
graphix = { git = "https://codeberg.org/robolibs/graphix.git", tag = "0.1.1" }
pyo3 = { version = "0.23", optional = true, features = [
    "abi3-py39",
    "extension-module",
] }

[dev-dependencies]
rerun = { version = "0.31.2", default-features = false, features = ["sdk", "server"] }
